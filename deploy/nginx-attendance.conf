# Attendance & Auto-Scheduler API at http://160.187.228.64/ (plain HTTP:
# Let's Encrypt does not issue certificates for a bare IP).
# server_name is the IP, so this block wins over the `default` site for
# requests addressed to the IP and leaves the named sites untouched.
#
# Install (needs sudo):
#   sudo cp nginx-attendance.conf /etc/nginx/sites-available/attendance-scheduler
#   sudo ln -sf /etc/nginx/sites-available/attendance-scheduler /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name 160.187.228.64;

    # Flight-plan Excel imports.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating a month runs the solver for up to a minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
