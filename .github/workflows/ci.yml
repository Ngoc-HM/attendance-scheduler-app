name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the release tag is in the comment).
# To update one: resolve the new tag with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (follow the object url when it is an annotated tag) and replace both.

jobs:
  backend:
    name: Backend (lint, types, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
      - name: Install dependencies (pinned by requirements.lock)
        id: install
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type-check (mypy)
        run: mypy app
      - name: Tests on SQLite
        run: pytest
      - name: Migrations on a fresh PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/attendance_test
          AUTO_CREATE_TABLES: "false"
        run: |
          alembic upgrade head
          alembic current
      - name: Models match migrations (alembic check)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/attendance_test
          AUTO_CREATE_TABLES: "false"
        run: alembic check
      - name: Tests on PostgreSQL
        # Still runs when `alembic check` reports drift, so that failure does
        # not hide the suite result.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/attendance_test
          AUTO_CREATE_TABLES: "true"
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
          AUTORUN_ENABLED: "false"
        run: pytest -p no:cacheprovider
      - name: Production guard smoke (must refuse dev defaults)
        # Runs even when tests failed (the guard is independent of them), but
        # only when the dependencies installed: otherwise any import error
        # would look like the guard firing.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ENVIRONMENT: prod
          DATABASE_URL: sqlite:///./guard.db
        run: |
          if python -c "from app.core.config import settings; settings.validate_for_environment()" 2> guard.err; then
            echo "Guard did not fire" && exit 1
          elif grep -q "Refusing to start: unsafe settings" guard.err; then
            echo "Guard refused unsafe defaults as expected"
          else
            cat guard.err
            echo "Guard step failed for another reason" && exit 1
          fi

  flutter:
    name: Flutter (analyze + tests, goldens excluded)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: attendance_scheduler_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      # Pixel goldens are rendered on macOS and only match there; the
      # flutter-goldens job runs them.
      - run: flutter test --exclude-tags golden

  flutter-goldens:
    name: Flutter goldens (macOS)
    # Pinned image (not macos-latest): golden rendering must not drift when
    # GitHub moves the label to a newer macOS.
    runs-on: macos-15
    defaults:
      run:
        working-directory: attendance_scheduler_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --tags golden
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-failures
          path: attendance_scheduler_app/test/failures
          if-no-files-found: ignore

  windows-build:
    name: Windows desktop build
    runs-on: windows-latest
    needs: flutter
    defaults:
      run:
        working-directory: attendance_scheduler_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attendance-scheduler-windows
          path: attendance_scheduler_app/build/windows/x64/runner/Release
          if-no-files-found: error
