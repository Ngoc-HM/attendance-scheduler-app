name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type-check (mypy)
        run: mypy app
      - name: Tests on SQLite
        run: pytest
      - name: Migrations on a fresh PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/attendance_test
          AUTO_CREATE_TABLES: "false"
        run: |
          alembic upgrade head
          alembic current
      - name: Tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/attendance_test
          AUTO_CREATE_TABLES: "true"
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
          AUTORUN_ENABLED: "false"
        run: pytest -p no:cacheprovider
      - name: Production guard smoke (must refuse dev defaults)
        env:
          ENVIRONMENT: prod
          DATABASE_URL: sqlite:///./guard.db
        run: |
          if python -c "from app.core.config import settings; settings.validate_for_environment()"; then
            echo "Guard did not fire" && exit 1
          else
            echo "Guard refused unsafe defaults as expected"
          fi

  flutter:
    name: Flutter (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance_scheduler_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-build:
    name: Windows desktop build
    runs-on: windows-latest
    needs: flutter
    defaults:
      run:
        working-directory: attendance_scheduler_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-scheduler-windows
          path: attendance_scheduler_app/build/windows/x64/runner/Release
          if-no-files-found: error
