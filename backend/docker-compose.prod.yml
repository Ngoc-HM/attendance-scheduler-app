# Production-like stack on a single server: PostgreSQL + API, both private
# to the host. A reverse proxy on the host (nginx, deploy/nginx-attendance.conf)
# publishes the API; nothing here listens on a public interface.
#
#   cp .env.prod.example .env.prod   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: attendance-scheduler-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://attendance:${POSTGRES_PASSWORD}@db:5432/attendance
    # Loopback only: the host's reverse proxy is the public entry point.
    ports:
      - "127.0.0.1:8035:8035"

volumes:
  pgdata:
