# Local dev stack: PostgreSQL + API. For production prefer a managed
# EU/Frankfurt-region PostgreSQL (spec §9.4) and sign a DPA with the provider.
#
# `make dev` / `make db` start only the `db` service; the backend then runs on
# the host and reaches it at localhost:5432 (the DATABASE_URL in .env.example).
name: attendance-scheduler

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    # Loopback only: these are development credentials, so the database must
    # not be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The API runs `alembic upgrade head` on start; wait until PostgreSQL
    # accepts connections instead of racing it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8035:8035"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/attendance

volumes:
  pgdata:
